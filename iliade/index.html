e feedback"></div><div class="actions"><button id="confirm" class="primary" onclick="check()">Conferma risposta</button><button id="next" class="primary hide" onclick="next()">Prossima →</button></div></section><section id="end" class="panel hide"><h2>Prova completata</h2><p id="score"></p><div class="actions"><button class="primary" onclick="home()">Torna alle prove</button><button class="secondary" onclick="exportErrors()">⬇ Esporta errori</button></div></section></main><footer>Gentilini Davide · Quiz didattico</footer><script>const QUESTIONS=[{"q":"Quale anno indica il libro come inizio tradizionale della guerra di Troia?","opts":["1194 a.C.","776 a.C.","480 a.C.","753 a.C."],"a":0,"why":"La tradizione riportata nel manuale colloca l'inizio nel 1194 a.C."},{"q":"Chi guidò gli scavi che portarono alla luce resti identificati con Troia?","opts":["Giambattista Vico","Heinrich Schliemann","Friedrich A. Wolf","Milman Parry"],"a":1,"why":"Schliemann condusse gli scavi a Hissarlik nel XIX secolo."},{"q":"Quale ideale distingue l'eroe omerico secondo il testo?","opts":["Rinuncia alla competizione","Anonimato del guerriero","Gloria individuale e fama","Uguaglianza politica"],"a":2,"why":"L'eroe cerca prestigio e memoria duratura del proprio nome."},{"q":"Chi è il capo dell'esercito acheo a Troia?","opts":["Menelao","Achille","Patroclo","Agamennone"],"a":3,"why":"Agamennone guida la spedizione degli Achei."},{"q":"Chi è il fratello di Agamennone?","opts":["Menelao","Priamo","Ettore","Peleo"],"a":0,"why":"Menelao, re di Sparta, è fratello di Agamennone."},{"q":"Chi è la moglie di Menelao?","opts":["Criseide","Elena","Briseide","Andromaca"],"a":1,"why":"Elena è la moglie di Menelao."},{"q":"Chi è il padre mortale di Achille?","opts":["Atreo","Menezio","Peleo","Priamo"],"a":2,"why":"Peleo è il padre di Achille; la madre è Teti."},{"q":"Chi è la madre divina di Achille?","opts":["Era","Afrodite","Atena","Teti"],"a":3,"why":"Teti è una divinità marina."},{"q":"Dove Teti immerge Achille secondo la leggenda riportata?","opts":["Nello Stige","Nello Scamandro","Nel Nilo","Nell'Eufrate"],"a":0,"why":"Il racconto del tallone vulnerabile è legato alle acque dello Stige."},{"q":"Chi uccide Achille secondo la tradizione citata?","opts":["Agamennone","Paride","Ettore","Priamo"],"a":1,"why":"Paride lo colpisce al tallone con l'aiuto di Apollo; non è narrato nell'Iliade."},{"q":"Quale epiteto patronimico è riferito ad Achille?","opts":["Cronide","Laerziade","Pelide","Atride"],"a":2,"why":"Pelide significa figlio di Peleo."},{"q":"Quale epiteto patronimico identifica Agamennone?","opts":["Pelide","Cronide","Eacide","Atride"],"a":3,"why":"Atride significa figlio di Atreo."},{"q":"Chi costringe Agamennone a restituire Criseide attraverso una pestilenza?","opts":["Apollo","Zeus","Efesto","Poseidone"],"a":0,"why":"Apollo manda la pestilenza in risposta all'offesa al sacerdote Crise."},{"q":"Come si chiama il padre di Criseide?","opts":["Laerte","Crise","Peleo","Menezio"],"a":1,"why":"Crise è sacerdote di Apollo."},{"q":"Chi viene sottratta ad Achille da Agamennone?","opts":["Andromaca","Erinni","Briseide","Elena"],"a":2,"why":"Briseide è il premio di guerra di Achille."},{"q":"Quale parola greca indica l'ira di Achille all'inizio dell'Iliade?","opts":["Nóus","Psyché","Ghéras","Ménis"],"a":3,"why":"Ménis è il termine greco richiamato nel manuale per l'ira."},{"q":"Chi si ritira dalla battaglia dopo lo scontro con Agamennone?","opts":["Achille","Odisseo","Ettore","Menelao"],"a":0,"why":"Achille rifiuta di combattere dopo la sottrazione di Briseide."},{"q":"Chi entra in battaglia indossando le armi di Achille?","opts":["Priamo","Patroclo","Paride","Aiace"],"a":1,"why":"Patroclo combatte con le armi dell'amico."},{"q":"Chi uccide Patroclo?","opts":["Menelao","Odisseo","Ettore","Paride"],"a":2,"why":"Ettore uccide Patroclo presso Troia."},{"q":"Chi uccide Ettore?","opts":["Agamennone","Patroclo","Diomede","Achille"],"a":3,"why":"Achille vendica Patroclo uccidendo Ettore."},{"q":"Chi supplica Achille per riavere il corpo di Ettore?","opts":["Priamo","Paride","Menelao","Enea"],"a":0,"why":"Priamo si reca alla tenda di Achille."},{"q":"Quale evento conclude l'Iliade secondo il manuale?","opts":["Il ritorno di Odisseo","I funerali di Ettore","La caduta di Troia","La morte di Achille"],"a":1,"why":"Il poema termina con le esequie di Ettore."},{"q":"Chi è la moglie di Ettore?","opts":["Era","Erinni","Andromaca","Elena"],"a":2,"why":"Andromaca è moglie di Ettore."},{"q":"Chi è il figlio di Ettore e Andromaca?","opts":["Telemaco","Neottolemo","Oreste","Astianatte"],"a":3,"why":"Astianatte è chiamato anche Scamandrio."},{"q":"Quale altro nome porta Astianatte?","opts":["Scamandrio","Atride","Pelide","Cronide"],"a":0,"why":"Il manuale indica Scamandrio come altro nome di Astianatte."},{"q":"Chi è il padre di Ettore e Paride?","opts":["Zeus","Priamo","Atreo","Peleo"],"a":1,"why":"Priamo è re di Troia e padre di entrambi."},{"q":"Chi rapisce Elena secondo il racconto tradizionale?","opts":["Patroclo","Achille","Paride","Ettore"],"a":2,"why":"Paride sottrae Elena a Menelao."},{"q":"Quale dea promette a Paride l'amore della donna più bella?","opts":["Atena","Era","Artemide","Afrodite"],"a":3,"why":"Afrodite offre a Paride Elena in cambio del giudizio."},{"q":"Quale dea offre a Paride la sapienza nella contesa?","opts":["Atena","Era","Afrodite","Teti"],"a":0,"why":"Atena è associata al dono della sapienza."},{"q":"Quale dea offre a Paride il potere nella contesa?","opts":["Erinni","Era","Atena","Afrodite"],"a":1,"why":"Era offre la ricchezza e il potere."},{"q":"Quale espressione greca indica il premio d'onore del guerriero?","opts":["Nóus","Ménis","Ghéras","Psyché"],"a":2,"why":"Ghéras designa il dono o premio attribuito al valore."},{"q":"Che cosa rappresenta Briseide nel codice sociale descritto?","opts":["Una sacerdotessa libera","Una regina achea","Una divinità protettrice","Un premio di guerra legato all'onore"],"a":3,"why":"Il testo spiega il legame tra bottino, dono e prestigio."},{"q":"Che cosa indica nóus nel quadro dell'interiorità omerica?","opts":["La parte razionale","Il bottino di guerra","Il fiume degli inferi","L'epiteto eroico"],"a":0,"why":"Nóus è associato alla dimensione razionale, localizzata nella testa."},{"q":"Che cosa indica psyché nel passo del manuale?","opts":["La gloria immortale","Il soffio vitale quando lascia il corpo","Il coraggio in battaglia","Il consiglio degli Achei"],"a":1,"why":"Psyché designa il soffio vitale nel momento del distacco dal corpo."},{"q":"Dove sono collocate molte emozioni nell'immaginario omerico?","opts":["Nelle mani","Nelle orecchie","Nella zona attorno al cuore","Nei piedi"],"a":2,"why":"Il manuale collega molte emozioni alla regione del cuore."},{"q":"Come vengono spesso spiegate le decisioni umane nell'epica omerica?","opts":["Come calcoli statistici","Come votazioni assembleari","Come leggi scritte","Come effetto di interventi divini"],"a":3,"why":"Gli dèi possono determinare scelte e comportamenti."},{"q":"Qual è l'epiteto di Atena citato nel manuale?","opts":["Pallade","Pelide","Atride","Scamandrio"],"a":0,"why":"Atena è chiamata Pallade."},{"q":"Quale epiteto è associato ad Atena?","opts":["Dea della caccia","Dea della sapienza","Dio del fuoco","Dio del mare"],"a":1,"why":"Atena è dea della sapienza e alleata degli Achei."},{"q":"Chi è il marito di Era?","opts":["Apollo","Ares","Zeus","Efesto"],"a":2,"why":"Era è moglie di Zeus."},{"q":"Di che cosa è dio Efesto?","opts":["Mare e terremoti","Guerra e inganno","Venti e tempeste","Fuoco e metalli"],"a":3,"why":"Efesto fabbrica lo scudo di Achille."},{"q":"Chi forgia lo scudo di Achille?","opts":["Efesto","Apollo","Zeus","Poseidone"],"a":0,"why":"Efesto è il fabbro divino."},{"q":"Chi è Eris nel racconto delle nozze di Peleo e Teti?","opts":["La dea del mare","La dea della discordia","La dea della sapienza","La dea della caccia"],"a":1,"why":"Eris, esclusa dal banchetto, getta la mela della contesa."},{"q":"Chi è la madre di Eris secondo il testo?","opts":["Afrodite","Teti","Non viene specificata","Era"],"a":2,"why":"Il manuale menziona Eris come dea della discordia, non la sua genealogia."},{"q":"Quale dea non fu invitata al banchetto delle nozze di Peleo e Teti?","opts":["Atena","Afrodite","Era","Eris"],"a":3,"why":"Eris scatena la contesa della mela."},{"q":"Che cosa reca la mela lanciata da Eris?","opts":["La scritta «alla più bella»","Il nome di Elena","Il sigillo di Zeus","L'ordine di guerra"],"a":0,"why":"La mela provoca la disputa tra le dee."},{"q":"Chi è il padre degli dèi e degli uomini?","opts":["Ares","Zeus","Apollo","Efesto"],"a":1,"why":"Zeus è indicato come padre degli dèi e degli uomini."},{"q":"Chi è il padre di Zeus?","opts":["Atreo","Priamo","Crono","Peleo"],"a":2,"why":"Zeus è figlio di Crono."},{"q":"Chi è la moglie di Zeus?","opts":["Teti","Atena","Artemide","Era"],"a":3,"why":"Era è la sposa di Zeus."},{"q":"Quale dea parteggia per i Troiani dopo il giudizio di Paride?","opts":["Afrodite","Atena","Era","Teti"],"a":0,"why":"Afrodite aiuta Paride e sostiene i Troiani."},{"q":"Chi suggerisce agli Achei lo stratagemma del cavallo?","opts":["Ettore","Odisseo","Achille","Priamo"],"a":1,"why":"Odisseo è celebre per l'astuzia e il cavallo di Troia."},{"q":"Di quale città è re Odisseo?","opts":["Troia","Sparta","Itaca","Argo"],"a":2,"why":"Odisseo è re di Itaca."},{"q":"Chi è la moglie di Odisseo?","opts":["Elena","Andromaca","Clitennestra","Penelope"],"a":3,"why":"Penelope attende il ritorno di Odisseo."},{"q":"Quale poema racconta il viaggio di ritorno di Odisseo?","opts":["Odissea","Iliade","Teogonia","Eneide"],"a":0,"why":"Il nóstos di Odisseo è il tema dell'Odissea."},{"q":"Chi è il padre di Patroclo?","opts":["Atreo","Menezio","Peleo","Priamo"],"a":1,"why":"Il manuale lo presenta come figlio di Menezio."},{"q":"Chi è il padre di Andromaca?","opts":["Atreo","Laerte","Eezione","Priamo"],"a":2,"why":"Eezione è re di Tebe Ipoplacia."},{"q":"Chi è il figlio di Achille che cattura Andromaca?","opts":["Telemaco","Astianatte","Oreste","Neottolemo"],"a":3,"why":"Andromaca è assegnata a Neottolemo."},{"q":"Chi uccide Astianatte secondo il testo?","opts":["Odisseo","Ettore","Menelao","Agamennone"],"a":0,"why":"Il manuale attribuisce a Odisseo il gesto."},{"q":"Chi è la moglie di Agamennone?","opts":["Andromaca","Clitennestra","Elena","Penelope"],"a":1,"why":"Clitennestra uccide Agamennone al ritorno."},{"q":"Chi aiuta Clitennestra a uccidere Agamennone?","opts":["Patroclo","Peleo","Egisto","Priamo"],"a":2,"why":"Egisto è l'amante di Clitennestra."},{"q":"Chi è la figlia sacrificata da Agamennone?","opts":["Elena","Criseide","Briseide","Ifigenia"],"a":3,"why":"Il sacrificio di Ifigenia è legato alla partenza da Aulide."},{"q":"Chi è la madre di Elena nel racconto riportato?","opts":["Leda","Era","Teti","Doris"],"a":0,"why":"Zeus si unisce a Leda in forma di cigno."},{"q":"Chi sono i Dioscuri?","opts":["Agamennone e Menelao","Castore e Polluce","Ettore e Paride","Achille e Patroclo"],"a":1,"why":"Castore e Polluce sono i gemelli citati nel manuale."},{"q":"In quale secolo a.C. si collocano i primi dubbi alessandrini sull'autore unico?","opts":["V secolo a.C.","I secolo d.C.","III secolo a.C.","VIII secolo a.C."],"a":2,"why":"Il manuale colloca gli interrogativi già in epoca alessandrina."},{"q":"Chi nel Seicento dubita dell'esistenza storica di Omero?","opts":["Milman Parry","Heinrich Schliemann","Friedrich Nietzsche","François Hédelin d'Aubignac"],"a":3,"why":"L'abate d'Aubignac è citato come precursore."},{"q":"Chi sostiene nel Settecento l'origine collettiva dei poemi?","opts":["Giambattista Vico","Milman Parry","Heinrich Schliemann","Aristotele"],"a":0,"why":"Vico interpreta l'epica come prodotto collettivo."},{"q":"Chi pubblica nel 1795 un'opera decisiva sulla questione omerica?","opts":["Giambattista Vico","Friedrich August Wolf","Milman Parry","François d'Aubignac"],"a":1,"why":"Wolf propone una lunga formazione orale prima della scrittura."},{"q":"Quale orientamento valorizza incongruenze e ripetizioni nei poemi?","opts":["Alessandrino","Archeologico","Analitico","Unitario"],"a":2,"why":"L'orientamento analitico distingue nuclei narrativi differenti."},{"q":"Quale orientamento insiste sulla coerenza artistica dei poemi?","opts":["Analitico","Archeologico","Epigrafico","Unitario"],"a":3,"why":"Gli unitari valorizzano la composizione complessiva."},{"q":"Chi studia l'epica orale balcanica nel Novecento?","opts":["Milman Parry","Giambattista Vico","Peleo","Heinrich Schliemann"],"a":0,"why":"Parry confronta i poemi con tradizioni orali vive."},{"q":"Che cos'è un guslar?","opts":["Un fabbro divino","Un cantore che suona la gusle","Un re acheo","Un sacerdote di Apollo"],"a":1,"why":"Il guslar è un cantore epico della tradizione balcanica."},{"q":"Che cosa sono gli epiteti formulari nell'epica?","opts":["Date degli eventi","Nomi dei copisti","Espressioni ricorrenti associate a personaggi","Titoli di capitoli"],"a":2,"why":"Le formule facilitano la composizione e trasmissione orale."},{"q":"Che cosa indica la teoria dell'oralità di Parry?","opts":["L'invenzione della stampa","La traduzione latina dell'Iliade","La scrittura immediata del poema","L'origine e trasmissione orale dell'epica"],"a":3,"why":"Parry evidenzia formule, ripetizioni e tecniche della recitazione orale."},{"q":"Perché le ripetizioni possono essere tipiche dell'epica?","opts":["Agevolano la composizione orale","Provano un errore di stampa","Segnalano sempre due autori","Eliminano la metrica"],"a":0,"why":"La ripetizione può essere una risorsa della performance orale."},{"q":"Quale luogo è identificato dagli scavi di Schliemann?","opts":["Argo","Hissarlik","Itaca","Aulide"],"a":1,"why":"Il sito di Hissarlik è associato alla Troia storica."},{"q":"Dove si trova Hissarlik?","opts":["In Sicilia","In Egitto","Nell'odierna Turchia","Nell'odierna Grecia continentale"],"a":2,"why":"Il sito di Troia è
